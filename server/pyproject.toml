[project]
name = "private-llm-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "ANN"]
ignore = ["ANN401"]  # 필드 구성이 고정되지 않은 프록시 JSON 응답을 위한 Any 허용

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
