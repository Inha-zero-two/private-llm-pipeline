[project]
name = "private-llm-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.2",
    "fastembed>=0.9.1",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
# server/에서 실행해도 app(server/)과 래퍼의 src(저장소 루트)를 모두 찾도록 경로 지정
pythonpath = [".", ".."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "ANN"]
ignore = ["ANN401"]  # 필드 구성이 고정되지 않은 프록시 JSON 응답을 위한 Any 허용

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
